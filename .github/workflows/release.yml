# Modified by Tianyu (Sky) Lu in 2026: rewrote the release workflow to build the macOS and Linux files of this project, name them by version, sign their SHA-256 files and notify q0wkp/pkgs, and dropped Windows; renamed the Warp and Zap names to ZapNG.

# The release of prebuilt archives: pushing a version tag runs ci.yml, then builds the archives on
# each system, and creates the GitHub release with them. This file holds all of the project's
# releasing; what is marked Per project is this project's own. By hand: the same build commands,
# sha256sum of each CLI archive into its .sha256, then gh release create with the archives.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Per project: ZapNG's own channel, whose config is built in (app/src/bin/oss.rs); the others need
  # Warp's private channel config.
  CHANNEL: oss
  CARGO_TERM_COLOR: always

jobs:
  # Whether the tag is a pre-release: one that ends in -alpha, -beta, -rc, -pre, -preview or -dev,
  # with or without a number after it (v1.2.0-rc.1, v1.2.0-rc1; in a sidestream fork
  # v0.8.2-mod.2-rc.1, while v0.8.2-mod.2 is a release). A pre-release is built as a release is and gets a GitHub pre-release with its files,
  # to download and try: it goes to no registry or package repository, and starts no other workflow.
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eq -- '-(alpha|beta|rc|pre|preview|dev)\.?[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Per project: no ci.yml, as in a fork whose tests run in build: the build below compiles every
  # file of the release from the tag, and a release goes out only when all of them build.

  # Builds the archives from the tag, with neither a secret nor a token that can write: building runs
  # the project's code and its dependencies'.
  build:
    needs: kind
    strategy:
      fail-fast: false
      matrix:
        # Per project: the systems the release ships for, each with the name its files carry:
        # zap-ng-<version>-<name>.dmg and .tar.gz on macOS, .AppImage and .tar.gz on Linux, the version
        # being the tag without its v, and github-release adds each .tar.gz's .sha256 and .sha256.asc. ZapNG's
        # auto-update (app/src/autoupdate/github.rs), its remote server
        # (crates/remote_server/src/setup.rs) and q0wkp/pkgs look for these names. The deb,
        # rpm and Arch packages keep the names their package managers give them.
        include:
          - os: macos-26
            name: macos-aarch64
            arch: aarch64
          - os: macos-26-intel
            name: macos-x86_64
            arch: x86_64
          # 22.04's glibc 2.35, not 24.04's 2.39: the AppImage and the packages link against the
          # build system's glibc, so they run on Ubuntu 22.04, Debian 12 and later.
          - os: ubuntu-22.04
            name: linux-x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # The macOS builds, without a cache, have taken over three hours on Intel.
    timeout-minutes: 360
    env:
      GIT_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Per project: the steps that build the program from the tag and put it, with its license
      # texts, into dist/ as the files of each system, named <project>-<version>-<name>.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0
          # What is published is built from scratch, not from a cache another run wrote.
          package-manager-cache: false
      # Yarn, at the version the build of the command signatures asks for.
      - name: Enable Corepack
        run: corepack enable

      # The Linux job builds the GUI and then the static CLI on one disk; the preinstalled
      # toolchains it doesn't use would leave too little room for both.
      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Install the build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          ./script/linux/install_build_deps
          # rpmbuild and fakeroot for the rpm and deb packages.
          sudo apt-get install -y libdbus-1-dev fakeroot rpm
          ./script/install_cargo_release_deps
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          ./script/install_cargo_release_deps
          ./script/install_cargo_bundle
          brew install create-dmg
          # Homebrew has no Intel bottle of protobuf, and building it takes over an hour, so
          # protoc comes from its own release, at the version script/linux/install_build_deps uses.
          protoc_version=25.1
          case "$(uname -m)" in
            x86_64) protoc_arch=x86_64 ;;
            arm64) protoc_arch=aarch_64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$protoc_version/protoc-$protoc_version-osx-$protoc_arch.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          # zap_ng_ui compiles its shaders with metal, which Xcode 26 ships as a separate download.
          xcodebuild -downloadComponent MetalToolchain

      - name: Add the Rust target
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then rustup target add "$ARCH-apple-darwin"
          else rustup target add "$ARCH-unknown-linux-gnu"; fi

      # Signed ad hoc, as no Apple Developer certificate is at hand: macOS then lets the app send
      # notifications, and Gatekeeper still asks on first launch (the Homebrew cask removes the
      # quarantine attribute).
      - name: Build the app (macOS)
        id: app_macos
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: script/bundle --channel "$CHANNEL" --arch "$ARCH" --selfsign

      - name: Build the CLI (macOS)
        id: cli_macos
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: script/bundle --channel "$CHANNEL" --arch "$ARCH" --artifact cli --nosign

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        env:
          NAME: ${{ matrix.name }}
          DMG_PATH: ${{ steps.app_macos.outputs.dmg_path }}
          BINARY: ${{ steps.cli_macos.outputs.binary_path }}
          RESOURCES: ${{ steps.cli_macos.outputs.bundled_resources_dir }}
        run: |
          version="${GIT_RELEASE_TAG#v}"
          mkdir -p dist
          cp "$DMG_PATH" "dist/zap-ng-$version-$NAME.dmg"
          cp "$BINARY" zap-ng
          tar czf "dist/zap-ng-$version-$NAME.tar.gz" zap-ng -C "$(dirname "$RESOURCES")" resources

      - name: Build the AppImage and the deb package (Linux)
        id: app_linux
        if: runner.os == 'Linux'
        env:
          # linuxdeploy and appimagetool without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: script/bundle --channel "$CHANNEL" --arch x86_64 --packages appimage,deb

      # From the binary the step above built and stripped, without building it again.
      - name: Build the rpm package (Linux)
        if: runner.os == 'Linux'
        run: script/bundle --skip-build --channel "$CHANNEL" --arch x86_64 --packages rpm

      # makepkg exists only on Arch, so in an Arch container, as a user other than root (makepkg
      # refuses root) with the runner's uid, which owns the checkout. GITHUB_ACTIONS stays outside:
      # script/bundle would write to a GITHUB_OUTPUT the container doesn't have.
      - name: Build the Arch package (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --pull=always -v "$PWD:/work" -v "$HOME/.cargo:/cargo-home" -w /work \
            -e GIT_RELEASE_TAG -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            docker.io/library/archlinux:latest bash -euxc '
              # The runtime dependencies first, since makepkg -s would ask for a sudo password.
              pacman -Syu --noconfirm --needed base-devel git sudo rust cargo-about \
                alsa-lib curl default-cursors fontconfig libegl libx11 libxcb libxcursor libxi \
                libxkbcommon-x11 wayland xdg-utils xz zlib
              groupadd -g "$HOST_GID" builder 2>/dev/null || true
              useradd -u "$HOST_UID" -g "$HOST_GID" -m builder
              sudo -u builder env HOME=/home/builder CARGO_HOME=/cargo-home \
                PATH=/cargo-home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
                GIT_RELEASE_TAG="$GIT_RELEASE_TAG" SKIP_SETTINGS_SCHEMA=1 MAKEPKG_EXTRA_ARGS=--noconfirm \
                bash -c "git config --global --add safe.directory /work &&
                  script/bundle --skip-build --channel oss --arch x86_64 --packages arch"
            '

      - name: Collect the packages (Linux)
        if: runner.os == 'Linux'
        env:
          NAME: ${{ matrix.name }}
          PACKAGES_DIR: ${{ steps.app_linux.outputs.packages_dir }}
        run: |
          version="${GIT_RELEASE_TAG#v}"
          mkdir -p dist
          find "$PACKAGES_DIR" -maxdepth 1 -type f -exec cp {} dist/ \;
          # linuxdeploy names the AppImage after the app and the architecture.
          mv dist/ZapNG-x86_64.AppImage "dist/zap-ng-$version-$NAME.AppImage"
          ls -l dist
          # The CLI below is built with another profile, and both don't fit on the disk.
          rm -rf target/release-lto

      # The CLI that ZapNG's remote server installs on other hosts: linked statically against musl
      # with cargo zigbuild, so it runs on any x86_64 Linux whatever its libc.
      - name: Install zig and cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          zig_version=0.13.0
          mkdir -p "$HOME/.local/zig"
          curl -fsSL "https://ziglang.org/download/$zig_version/zig-linux-x86_64-$zig_version.tar.xz" \
            | tar -xJ -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version ^0.19

      - name: Build the CLI (Linux)
        id: cli_linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          USE_ZIGBUILD: "true"
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --packages none \
            --target x86_64-unknown-linux-musl

      - name: Pack the CLI (Linux)
        if: runner.os == 'Linux'
        env:
          NAME: ${{ matrix.name }}
          BINARY: ${{ steps.cli_linux.outputs.executable_path }}
          RESOURCES: ${{ steps.cli_linux.outputs.bundled_resources_dir }}
        run: |
          version="${GIT_RELEASE_TAG#v}"
          cp "$BINARY" zap-ng
          tar czf "dist/zap-ng-$version-$NAME.tar.gz" zap-ng -C "$(dirname "$RESOURCES")" resources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Creates the release from the archives build made, and runs none of the project's code.
  github-release:
    needs: [kind, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      # The remote server installs a CLI archive on another host only once its SHA-256 matches
      # the one in zap-ng-<version>-<name>.tar.gz.sha256 (crates/remote_server/src/setup.rs), a line
      # of sha256sum's output. Computed here, from the files the release gets.
      - name: Write the SHA-256 of the CLI archives
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          found=
          for archive in zap-ng-"$version"-*.tar.gz; do
            [ -f "$archive" ] || continue
            sha256sum "$archive" > "$archive.sha256"
            cat "$archive.sha256"
            found=1
          done
          if [ -z "$found" ]; then
            echo "::error::no CLI archive zap-ng-$version-*.tar.gz to write the SHA-256 of"
            exit 1
          fi

      # A .sha256 comes from where its archive does, so it only tells a damaged download from a
      # whole one. ZapNG built from this tag installs the archive only when the .sha256 also has a
      # signature, <archive>.sha256.asc (OpenPGP, armored), by the key whose public half that ZapNG was built
      # with, crates/remote_server/src/release_signing_key.pub at this tag. Each signature is
      # checked against that file here, so a secret that doesn't match it fails the release
      # instead of publishing archives no ZapNG would install.
      - name: Sign the SHA-256 files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.PKGS_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::the secret PKGS_SIGNING_KEY, the armored OpenPGP key that signs q0wkp/pkgs, is not set"
            exit 1
          fi
          umask 077
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          # The client holds the 32 bytes of the Ed25519 public key; gpg prints them, after a 0x40
          # byte, as the key's `pkey[1]`.
          expected=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/crates/remote_server/src/release_signing_key.pub?ref=$TAG" \
            | base64 -d | od -An -tx1 | tr -d ' \n' | tr a-f A-F)
          actual=$(gpg --batch --export | gpg --batch --list-packets --verbose \
            | sed -n 's/^[[:space:]]*pkey\[1\]: 40\([0-9A-F]\{64\}\)$/\1/p' | head -n 1)
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::PKGS_SIGNING_KEY is not the key in crates/remote_server/src/release_signing_key.pub"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          for checksum in zap-ng-"$version"-*.tar.gz.sha256; do
            gpg --batch --quiet --armor --detach-sign --output "$checksum.asc" "$checksum"
            gpg --batch --quiet --verify "$checksum.asc" "$checksum"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.kind.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --prerelease="$PRERELEASE"

  # Asks q0wkp/pkgs to package this release, which nothing else does: its Sync workflow has no
  # schedule. The token is a fine-grained one of q0wkp's, for q0wkp/pkgs only, with Actions read and
  # write: it can start the workflow but not change the repository. Without it this job fails, so the
  # failed run's mail says the release is waiting.
  pkgs:
    # After the job that creates the release, which this one reads. Not for a pre-release.
    needs: [kind, github-release]
    if: needs.kind.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask q0wkp/pkgs to package the release
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PKGS_DISPATCH_TOKEN is not set: q0wkp/pkgs won't package this release until its Sync workflow is run by hand"
            exit 1
          fi
          gh workflow run sync.yml -R q0wkp/pkgs -f packages="zap-ng"
