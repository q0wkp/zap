# Modified by Tianyu (Sky) Lu in 2026: removed the Windows-only dependency; renamed the Warp and Zap names to ZapNG.

[package]
name = "zap_ng_cli"
edition = "2024"
description = "CLI argument parsing for Warp"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
cfg-if = { workspace = true }
humantime.workspace = true
jaq-all.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
zap_ng_core = { path = "../zap_ng_core" }
color-print = "0.3"
zap_ng_util = { path = "../zap_ng_util" }
clap_complete = "4.5.58"
anyhow.workspace = true

[build-dependencies]
cfg_aliases.workspace = true

[features]
integration_tests = []
api_key_authentication = []

[dev-dependencies]
serial_test = "0.8.0"
