# Modified by Tianyu (Sky) Lu in 2026: made tempfile a regular dependency in place of futures-lite for the askpass helper, and dropped a Windows remark from a comment; renamed the Warp and Zap names to ZapNG.

[package]
name = "zap_ng_ssh_manager"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
command.workspace = true
diesel = { workspace = true, features = ["chrono", "sqlite"] }
dirs.workspace = true
instant.workspace = true
keyring.workspace = true
log.workspace = true
persistence.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-escape.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt-multi-thread"] }
uuid.workspace = true
zap_ng_sync = { path = "../zap_ng_sync" }
zeroize = "1.8"

[dev-dependencies]
diesel = { workspace = true, features = ["chrono", "sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2.0"
# 静态链接 SQLite,避免依赖系统级 sqlite3。
libsqlite3-sys = { version = "0.33.0", features = ["bundled"] }
