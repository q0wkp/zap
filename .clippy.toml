# Modified by Tianyu (Sky) Lu in 2026: dropped the Windows-only code; renamed the Warp and Zap names to ZapNG.

disallowed-macros = [
    { path = "std::dbg", reason = "dbg!() is only for use in local testing, not submitted code" },
]

disallowed-types = [
    { path = "std::time::Instant", reason = "std::time::Instant is not implemented for wasm targets. Use instant::Instant instead." },
    { path = "std::process::Command", reason = "Spawn processes through the workspace's wrapper. Use command::blocking::Command instead." },
    { path = "async_process::Command", reason = "Spawn processes through the workspace's wrapper. Use command::r#async::Command instead." },
    { path = "tokio::process::Command", reason = "Spawn processes through the workspace's wrapper. Use command::r#async::Command instead.", allow-invalid = true },
]

disallowed-methods = [
    { path = "async_channel::Sender::send_blocking", reason = "send_blocking() does not exist for wasm.  Use zap_ng_ui::r#async::block_on() with send() instead.", allow-invalid = true },
    { path = "line_ending::LineEnding::from_current_platform", reason = "line_ending::LineEnding::from_current_platform does not account for Unix-like subsystems for Windows. In most cases, use warp_core::platform::SessionPlatform::default_line_ending() instead." },
]
