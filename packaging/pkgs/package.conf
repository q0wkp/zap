# Settings for sync.sh. Generated by the tlu-pkgs-repo skill.

# Key for versions/ in the repository, and the name in its README.
NAME=zap
# Where releases are published.
SOURCE_REPO=q0wkp/zap
# The package's name in each repository.
PACMAN_PACKAGE=zap
PACSTALL_PACKAGE=zap-deb
# build: makepkg runs PKGBUILD.in. prebuilt: the release already has a .pkg.tar.zst, as ASSETS PKG.
ARCH_MODE=prebuilt
# KEY=PATTERN for each release file to hash, where {version} is the tag without its v. The templates
# get @@ASSET_KEY@@ and @@SHA256_KEY@@. A release missing any of them is skipped until it has them.
ASSETS=(DEB=*amd64.deb PKG=*x86_64.pkg.tar.zst)
# true when the templates build from GitHub's tag tarball, for @@SHA256_SOURCE@@.
SOURCE_TARBALL=false
# Last column of the package list in the repository's README.
README_NOTES=x86_64\ only\,\ published\ from\ \`v2026.07.09.2-mod.3\`\ on

PKGS_REPO=q0wkp/pkgs
PACMAN_REPO=q0wkp
# The gh account that can write to PKGS_REPO.
GH_ACCOUNT=q0wkp
